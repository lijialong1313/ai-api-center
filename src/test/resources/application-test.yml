# 测试专用配置：把测试切到独立库文件，跑测试不碰任何真实数据。
spring:
  datasource:
    # 路径需与其他测试类一致：Spring 按配置缓存上下文，两个测试类用不同
    # datasource.url 会创建两个上下文，而 gaarason 的 ContainerBootstrap 是
    # 全进程唯一的，第二个上下文会失败。所以统一成一个测试库。
    url: jdbc:sqlite:data/test-ai-api-center.db

app:
  admin:
    # 测试库不预置启动管理员，避免影响 countAdmins / 最后管理员等断言
    bootstrap-admin-staff-no: ""

logging:
  level:
    root: WARN
    com.weacsoft.aiApiCenter: INFO
