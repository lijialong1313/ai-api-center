spring:
  application:
    name: ai-api-center
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${APP_DB_PATH:data/ai-api-center.db}
    hikari:
      maximum-pool-size: 10
      connection-test-query: SELECT 1
  mvc:
    throw-exception-if-no-handler-found: false
  config:
    # 本机真实凭证写在项目根目录的 application-local.yml（已 gitignore），
    # 仓库内只保留占位符与 application-local.yml.example 模板
    import: "optional:file:./application-local.yml"

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

logging:
  level:
    root: INFO
    com.weacsoft.aiApiCenter: DEBUG
    com.weacsoft.jaravel.vendor: INFO

jaravel:
  # 应用密钥：JWT 验签 / Cookie 加密 / 验证码均派生自它，多实例必须一致。
  # 生产部署必须设置 JARAVEL_KEY 环境变量；此处的默认值只是占位符，
  # 未设置时框架改用进程级随机密钥，重启后所有 JWT 失效。
  key: "${JARAVEL_KEY:please-set-JARAVEL_KEY-in-production}"
  # ---------- 迁移：业务表由 migration 模块统一建表 ----------
  migration:
    enabled: true
    source: CLASSPATH
    table: migrations
    auto-run: true

  # ---------- 队列驱动：sync（默认，内存）/ database（jobs 表）/ redis（三选一，见文档 §3.1） ----------
  queue:
    driver: ${QUEUE_DRIVER:sync}
    database:
      table: jobs
      auto-start: false
    redis-connection: ""

  # ---------- 缓存：in-flight 标记 / 权重缓存 ----------
  # 无 Redis 时 array（单机）或 database（多机）；有 Redis 时切 redis
  cache:
    default-store: ${CACHE_STORE:array}
    stores:
      array:
        driver: array
      database:
        driver: database

  # ---------- Redis（仅在显式选用时装配） ----------
  redis:
    options:
      cluster: redis
      prefix: "llm_gw_"
    connections:
      default:
        host: ${REDIS_HOST:127.0.0.1}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:}
        database: ${REDIS_DATABASE:0}

  cache-redis:
    connection: default
    auto-register: ${REDIS_ENABLED:false}

  # ---------- 认证：管理员使用统一身份认证 + JWT ----------
  auth:
    default-guard: admin
    guards:
      admin:
        driver: jwt
        provider: admins

  jwt:
    secret: ${JWT_SECRET:change-me-in-production-32-bytes-min!!}
    issuer: ai-api-center
    ttl: ${JWT_TTL_MS:86400000}
    refresh-enabled: true
    blacklist-enabled: true
    grace-period-seconds: 300

  # ---------- 视图：管理后台 Blade 模板 ----------
  view:
    template-dir: templates
    suffix: .blade.java

# ---------- 业务配置 ----------
app:
  # 管理后台访问控制
  admin:
    # true：完整认证与授权；false：跳过登录，仅限本机联调，启动时输出安全告警
    auth-enabled: "${ADMIN_AUTH_ENABLED:true}"
    # 启动时确保存在的管理员工号；留空关闭本机制。已存在时不修改任何字段
    bootstrap-admin-staff-no: "${BOOTSTRAP_ADMIN_STAFF_NO:2019095}"
    # 该工号的显示名称，留空时使用工号本身
    bootstrap-admin-name: "${BOOTSTRAP_ADMIN_NAME:}"
  # 统一身份认证（广州城市理工学院智慧校园认证系统 OAuth2.0，文档 v1.0.4）
  sso:
    enabled: ${SSO_ENABLED:true}
    base-url: ${SSO_BASE_URL:https://auth.gcu.edu.cn}
    # 由认证系统管理员分配。仓库内保持占位符，真实值写入 application-local.yml
    client-id: ${SSO_CLIENT_ID:}
    client-secret: ${SSO_CLIENT_SECRET:}
    # 认证系统跳回本系统的地址，必须与认证系统登记的一致；留空则按当前请求推导
    redirect-uri: ${SSO_REDIRECT_URI:}
    # 登录成功后由认证系统回跳的业务地址（callbackUrl）
    callback-url: ${SSO_CALLBACK_URL:/admin}
    # 允许登录管理后台的角色（allRole 任一命中即可）
    admin-roles: ${SSO_ADMIN_ROLES:教师,教职工}
  # 管理后台路径前缀（与 DSH 流量 /v1 分离）
  admin-path: /admin

